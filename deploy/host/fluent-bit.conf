# LogSight 서버 로그 즉시 전송 (수집 보호 방안 2)
# nginx·auth·kern 로그를 1분 안에 계정 밖 보관 버킷(Object Lock)으로 보낸다. 서버에는 쓰기 권한만 있다.
# 1분마다 생존 신호를 heartbeat/ 아래에 남겨, 끊기면 logsight watch --heartbeat 가 경보를 낸다.
# install.sh 가 @BUCKET@ @REGION@ @HOST@ 를 채운다. Fluent Bit 2.x 기준.

[SERVICE]
    Flush            5
    Log_Level        warn
    storage.path     /var/lib/fluent-bit/buffer
    storage.sync     normal

[INPUT]
    Name             tail
    Tag              nginx.access
    Path             /var/log/nginx/access.log
    DB               /var/lib/fluent-bit/nginx.db
    storage.type     filesystem
    Refresh_Interval 5

[INPUT]
    Name             tail
    Tag              host.auth
    Path             /var/log/auth.log,/var/log/secure
    DB               /var/lib/fluent-bit/auth.db
    storage.type     filesystem

[INPUT]
    Name             tail
    Tag              host.kern
    Path             /var/log/kern.log
    DB               /var/lib/fluent-bit/kern.db
    storage.type     filesystem

[INPUT]
    Name             dummy
    Tag              heartbeat
    Dummy            {"log": "logsight-heartbeat @HOST@"}
    Interval_Sec     60

# 원본 줄 그대로(log 키) 올린다. 파일 이름에 태그(nginx/auth/kern)가 들어가 LogSight가 종류를 알아본다.
[OUTPUT]
    Name             s3
    Match            nginx.* host.*
    bucket           @BUCKET@
    region           @REGION@
    log_key          log
    compression      gzip
    use_put_object   On
    send_content_md5 On
    total_file_size  1M
    upload_timeout   1m
    s3_key_format    /hosts/@HOST@/%Y/%m/%d/%H%M%S-$TAG-$UUID.log.gz

[OUTPUT]
    Name             s3
    Match            heartbeat
    bucket           @BUCKET@
    region           @REGION@
    log_key          log
    use_put_object   On
    send_content_md5 On
    upload_timeout   1m
    s3_key_format    /heartbeat/@HOST@/%Y/%m/%d/%H%M%S-$UUID.txt
