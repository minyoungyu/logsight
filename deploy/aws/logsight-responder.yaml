AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  LogSight automatic isolation role (option A). It can only: deactivate access keys, attach or detach
  the AWS managed AWSDenyAll policy on users and roles, and close security group ingress rules.
  It cannot delete anything, create anything, or attach any other policy. Reopening a closed
  security group rule (undo) is left to a human's own credentials on purpose.

Parameters:
  AnalysisServerPrincipalArn:
    Type: String
    Description: ARN of the analysis server's role or user that may assume this role (e.g. arn:aws:iam::123456789012:role/logsight-server).
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Shared secret the analysis server must pass when assuming the role.

Resources:
  ResponderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: logsight-responder
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref AnalysisServerPrincipalArn}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {sts:ExternalId: !Ref ExternalId}
      Policies:
        - PolicyName: isolate-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBeforeChange
                Effect: Allow
                Action: [iam:ListAccessKeys, iam:ListAttachedUserPolicies, iam:ListAttachedRolePolicies,
                         ec2:DescribeSecurityGroups]
                Resource: "*"
              - Sid: DeactivateKeys
                Effect: Allow
                Action: iam:UpdateAccessKey
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*
              - Sid: DenyAllPolicyOnly
                Effect: Allow
                Action: [iam:AttachUserPolicy, iam:DetachUserPolicy, iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/AWSDenyAll
              - Sid: CloseIngressOnly
                Effect: Allow
                Action: ec2:RevokeSecurityGroupIngress
                Resource: !Sub arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:security-group/*
              - Sid: NeverTouchServiceRolesOrSelf
                Effect: Deny
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/logsight-*

Outputs:
  ResponderRoleArn:
    Description: Put this in ~/.aws/config as a profile (role_arn + source_profile + external_id) and pass it as --respond-profile.
    Value: !GetAtt ResponderRole.Arn
