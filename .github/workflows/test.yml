name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt httpx "moto[ec2,s3,cloudtrail,iam,wafv2,elbv2,guardduty,sts]>=5"
      - run: python -m unittest discover -s tests -v
      - run: python -m logsight analyze samples/demo --out reports/ci --no-ai
      - run: python -m logsight analyze samples/free --out reports/ci-free --no-ai
      - run: python -m logsight analyze samples/combined --out reports/ci-combined --no-ai --year 2026
      - run: python -m logsight cost
      - run: python -m logsight scan --profile samples/web/profile.json --no-ai --out reports/ci-web
