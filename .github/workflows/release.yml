name: release
# 버전 태그(v0.4.0 등)를 올리면 시험판을 만든다: 설치 파일(whl), 샘플 보고서, Docker 이미지(GHCR).
# 태그를 올리지 않고 Actions 화면에서 "Run workflow"로 돌려도 된다(workflow_dispatch).
# 그때는 코드의 버전(logsight.__version__)으로 v태그와 릴리스를 main의 그 커밋에 만든다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: 태그와 코드 버전이 같은지 확인
        run: |
          v=$(python -c "import logsight; print(logsight.__version__)")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "TAG=v$v" >> "$GITHUB_ENV"
          else
            test "v$v" = "${GITHUB_REF_NAME}" || { echo "태그 ${GITHUB_REF_NAME} ≠ 코드 v$v"; exit 1; }
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
      - run: pip install build -r requirements.txt
      - run: python -m build
      - name: 샘플 보고서
        run: |
          python -m logsight analyze samples/combined --out sample-report --no-ai --year 2026
          (cd sample-report && zip -r ../sample-report.zip .)
      - name: 변경 기록에서 이 버전 부분만 꺼내기
        run: |
          v=${TAG#v}
          awk -v v="## $v" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "변경 기록: CHANGELOG.md" > notes.md
      - name: GitHub 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이미 있으면(앞선 실행이 중간에 실패한 경우) 파일만 바꿔 올린다
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* sample-report.zip --clobber
          else
            gh release create "$TAG" dist/* sample-report.zip --target "$GITHUB_SHA" \
              --title "LogSight $TAG (시험판)" --notes-file notes.md --prerelease
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker 이미지
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$img:${TAG#v}" -t "$img:latest" .
          docker push "$img:${TAG#v}"
          docker push "$img:latest"
