[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsight"
dynamic = ["version"]
description = "AWS 침해사고 초동 분석: 경보가 공격인지 우리 팀 작업인지 근거 로그와 함께 가려 주는 도구"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "팀 로그파인더" }]
dependencies = [
    "anthropic>=1.13.0",
    "networkx>=3.2",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx",
       "moto[ec2,s3,cloudtrail,iam,wafv2,elbv2,guardduty,sts,sqs]>=5"]

[project.scripts]
logsight = "logsight.__main__:main"

[project.urls]
Source = "https://github.com/minyoungyu/logsight"
Changelog = "https://github.com/minyoungyu/logsight/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "logsight.__version__" }

[tool.setuptools.packages.find]
include = ["logsight", "logsight.*"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
# 버그로 이어지는 것만 막는다(문법 오류, 정의 안 된 이름, 쓰지 않는 import·변수). 모양 규칙은 강제하지 않는다.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["logsight"]
